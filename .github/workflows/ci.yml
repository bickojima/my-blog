name: CI

on:
  push:
    branches: [ main, staging, feature/* ]
  pull_request:
    branches: [ main, staging ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # SEC-36（Issue #117 項目3）: サードパーティ action はタグではなく40桁の commit SHA で固定する。
    # タグは上流で付け替え可能なため。行末コメントは対応する版（更新時は SHA と版を同時に変える）。
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Check identities on incoming commits
        if: github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'staging'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          FULL_HISTORY: ${{ github.event_name == 'push' && github.event.forced || false }}
        run: node scripts/check-commit-identities.mjs

      - name: Install dependencies
        run: npm ci

      # Playwright E2E は実行しない（実行時間のためローカル運用。本番マージ前のローカル全件は必須。Bug #50）
      - name: Run Vitest Unit Tests
        run: npm test

      - name: Run Astro Build
        run: npm run build:raw
