# npm管理外依存の鮮度・EOL 週次チェック（SEC-40, Issue #132）
# - 判定: scripts/check-dependency-freshness.mjs（Node 組み込みのみ。npm ci 不要）
# - 結果: artifact `dependency-freshness`（latest.json / latest.md、90日保持）と Job Summary
# - 通知: alert → Issue を1件だけ起票（既存があればコメント追記）し、ジョブを失敗させて
#         GitHub の Actions 失敗通知も送る。error（全リモート照会失敗）→ ジョブ失敗。
#         warning はサマリーと JSON に記録するのみ（週次の棚卸し対象）。
# - 手順: docs/DOCUMENTATION.md 4.11章
name: Dependency freshness

on:
  schedule:
    - cron: '0 0 * * 1' # 毎週月曜 09:00 JST
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependency-freshness
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      status: ${{ steps.check.outputs.status }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Check non-npm dependencies
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-dependency-freshness.mjs --out-dir reports/dependency-freshness --fail-on never
          status="$(node -p "require('./reports/dependency-freshness/latest.json').status")"
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          cat reports/dependency-freshness/latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-freshness
          path: reports/dependency-freshness/
          retention-days: 90

      - name: Fail on error
        if: steps.check.outputs.status == 'error'
        run: |
          echo "::error::リモート照会がすべて失敗し判定できませんでした（latest.json を確認）"
          exit 1

  notify:
    needs: check
    if: needs.check.outputs.status == 'alert'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Download result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-freshness
          path: result

      - name: Open or update alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='[dependency-freshness] npm管理外依存に要対応（alert）があります'
          { cat result/latest.md; echo; echo "実行: ${RUN_URL}"; } > body.md
          number="$(gh issue list --state open --search "\"[dependency-freshness]\" in:title" --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")"
          if [ -n "${number}" ]; then
            gh issue comment "${number}" --body-file body.md
          else
            gh issue create --title "${title}" --body-file body.md
          fi

      - name: Fail on alert
        run: |
          echo "::error::npm管理外依存に alert があります（Issue とジョブサマリーを確認）"
          exit 1
